name: Publish to npm

# ROLLBACK RUNBOOK (see forge#2025 / PR #2018 staging review finding REG-2):
# This workflow publishes to the `latest` npm dist-tag on every qualifying push
# to `main`. If a bad release is published:
#   1. Do NOT run `npm unpublish`. Unpublishing removes the version entirely,
#      which breaks any consumer that has already resolved/installed it and
#      forfeits the version number (npm blocks republishing the same version
#      for 24h+). It also does not un-ship whatever already propagated.
#   2. Instead: `git revert` the offending commit(s) on `main`, push the
#      revert, and let this workflow publish a new patch version containing
#      the revert. This is the only supported rollback path — a forward-fix
#      release, not a destructive unpublish.
#   3. If the bad release must be hidden from new installs immediately while
#      the revert is prepared, use `npm dist-tag` to move `latest` back to the
#      last-known-good version (this does not remove the bad version, it only
#      stops it from being the default resolution target):
#       npm dist-tag add forgedock@<last-good-version> latest
#
# The `concurrency` group below serializes publish runs so two qualifying
# pushes landing close together (e.g. a merge immediately followed by this
# workflow's own auto-generated "chore: bump version" push) cannot race on
# the version bump / npm publish steps.
concurrency:
  group: publish-main
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths:
      - 'commands/**'
      - 'bin/**'
      - '.claude-plugin/**'
      - 'docs/**'
      - 'scripts/**'
      - 'templates/**'
      - 'src/**'
      # Keep the submodule gitlink path alongside descendant contents: a Pi fork
      # revision update is recorded as the exact vendor/pi entry.
      - 'vendor/pi'
      - 'vendor/pi/**'
      - 'vendor/pi-runtime'
      - 'vendor/pi-runtime/**'
      - 'package.json'
      - '.github/workflows/publish.yml'
  workflow_dispatch:  # Manual retrigger for bot-token merges

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
      packages: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0  # Full history needed for git describe --tags (path-guard check)
          submodules: recursive  # prepack rebuilds the pinned ForgeDock Pi fork

      - name: Check if publishable files changed
        run: |
          # Runs for both push and workflow_dispatch. workflow_dispatch has no
          # paths: filter (GitHub limitation), so this always needed to run for
          # that event. It must ALSO run on push: the push trigger's own
          # paths: filter includes this workflow's own file
          # ('.github/workflows/publish.yml', see forge#2278/#2284) so a push
          # touching only the workflow file satisfies the trigger without
          # touching any actually-publishable path. Re-diffing here (instead of
          # trusting the push paths: filter to mean "something publishable
          # changed") is what correctly sets SKIP_PUBLISH=true for that case.
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            echo "No previous tag found — proceeding with publish"
            echo "SKIP_PUBLISH=false" >> $GITHUB_ENV
          else
            # A submodule revision update is the exact vendor/pi gitlink; the
            # recursive pathspecs also cover changes within checked-out contents.
            CHANGED=$(git diff --name-only "$LAST_TAG"..HEAD -- \
              commands/ bin/ .claude-plugin/ docs/ scripts/ templates/ src/ package.json \
              'vendor/pi' 'vendor/pi/**' 'vendor/pi-runtime' 'vendor/pi-runtime/**' 2>/dev/null || echo "")
            if [ -z "$CHANGED" ]; then
              echo "No publish-relevant files changed since $LAST_TAG — skipping spurious dispatch"
              echo "SKIP_PUBLISH=true" >> $GITHUB_ENV
            else
              echo "Publish-relevant changes detected since $LAST_TAG:"
              echo "$CHANGED"
              echo "SKIP_PUBLISH=false" >> $GITHUB_ENV
            fi
          fi

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Check native command conflicts
        run: bash scripts/check-native-conflicts.sh commands/

      - name: Install ripgrep
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y ripgrep
          rg --version

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          # The pinned fork currently carries a forward dependency override not
          # reflected in its npm lock; install resolves that fork-local build graph.
          npm install --prefix vendor/pi --ignore-scripts --no-audit --no-fund

      - name: Hydrate pinned Pi offline model data
        run: npm --prefix vendor/pi run hydrate:model-data

      - name: Apply bundled subagent runtime patches
        run: node scripts/patch-pi-subagents-visibility.mjs

      - name: Run tests
        run: npm test

      - name: Determine version bump type
        if: env.SKIP_PUBLISH != 'true'
        run: |
          # Conventional-commit-aware bump: any feat()-scoped commit since the
          # last release tag bumps `minor`; otherwise `patch`. Major/breaking-change
          # detection is intentionally out of scope (no BREAKING CHANGE convention
          # is currently enforced in this repo — see forge#2036).
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            echo "No previous tag found — defaulting to patch bump"
            echo "BUMP_TYPE=patch" >> $GITHUB_ENV
          else
            COMMIT_SUBJECTS=$(git log "$LAST_TAG"..HEAD --format=%s 2>/dev/null || echo "")
            if echo "$COMMIT_SUBJECTS" | grep -qE '^feat(\([^)]*\))?!?:'; then
              echo "feat()-scoped commit(s) found since $LAST_TAG — bumping minor"
              echo "BUMP_TYPE=minor" >> $GITHUB_ENV
            else
              echo "No feat()-scoped commits since $LAST_TAG — bumping patch"
              echo "BUMP_TYPE=patch" >> $GITHUB_ENV
            fi
          fi

      - name: Bump version
        if: env.SKIP_PUBLISH != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          NEXT_VERSION=$(node -p "
            const [maj,min,pat] = '$CURRENT_VERSION'.split('.').map(Number);
            const bumpType = '$BUMP_TYPE';
            if (bumpType === 'minor') {
              \`\${maj}.\${min+1}.0\`;
            } else {
              \`\${maj}.\${min}.\${pat+1}\`;
            }
          ")

          # A rerun reconciles each registry independently. Only an exact successful
          # response means present, and only npm's explicit 404 means absent; every
          # auth, network, malformed, or ambiguous response fails closed.
          GITHUB_PACKAGES_NPMRC="$RUNNER_TEMP/forgedock-github-packages.npmrc"
          printf '%s\n' \
            "//npm.pkg.github.com/:_authToken=${GH_TOKEN}" \
            "@rapiercraftstudios:registry=https://npm.pkg.github.com" \
            > "$GITHUB_PACKAGES_NPMRC"

          query_registry_version() {
            local package_spec="$1"
            local registry="$2"
            local userconfig="$3"
            local label="$4"
            local output_file="$RUNNER_TEMP/forgedock-${label}.stdout"
            local error_file="$RUNNER_TEMP/forgedock-${label}.stderr"
            local status
            local output
            local error
            local -a npm_args

            npm_args=(show "$package_spec" version --silent "--registry=$registry")
            if [ -n "$userconfig" ]; then
              npm_args+=(--userconfig "$userconfig")
            fi

            set +e
            npm "${npm_args[@]}" >"$output_file" 2>"$error_file"
            status=$?
            set -e
            output=$(cat "$output_file")
            error=$(cat "$error_file")
            output=${output//$'\r'/}

            if [ "$status" -eq 0 ]; then
              if [ "$output" = "$NEXT_VERSION" ]; then
                printf 'true'
                return 0
              fi
              echo "Ambiguous $label registry response; refusing to publish or finalize" >&2
              return 1
            fi
            if [ -n "$output" ]; then
              echo "Unexpected $label registry output on failed lookup; refusing to publish or finalize" >&2
              return 1
            fi
            if printf '%s\n' "$error" | grep -Eiq 'E404|404[[:space:]]+Not Found|is not in this registry'; then
              printf 'false'
              return 0
            fi
            echo "$label registry lookup failed without an explicit not-found response; refusing to publish or finalize" >&2
            return 1
          }

          NPM_ALREADY_PUBLISHED=$(query_registry_version \
            "forgedock@$NEXT_VERSION" \
            "https://registry.npmjs.org" \
            "" \
            "npmjs")
          GITHUB_PACKAGES_ALREADY_PUBLISHED=$(query_registry_version \
            "@rapiercraftstudios/forgedock@$NEXT_VERSION" \
            "https://npm.pkg.github.com" \
            "$GITHUB_PACKAGES_NPMRC" \
            "github-packages")
          case "$NPM_ALREADY_PUBLISHED" in
            true|false) ;;
            *) echo "Invalid npm registry state; refusing to publish or finalize" >&2; exit 1 ;;
          esac
          case "$GITHUB_PACKAGES_ALREADY_PUBLISHED" in
            true|false) ;;
            *) echo "Invalid GitHub Packages registry state; refusing to publish or finalize" >&2; exit 1 ;;
          esac
          echo "NPM_ALREADY_PUBLISHED=$NPM_ALREADY_PUBLISHED" >> "$GITHUB_ENV"
          echo "GITHUB_PACKAGES_ALREADY_PUBLISHED=$GITHUB_PACKAGES_ALREADY_PUBLISHED" >> "$GITHUB_ENV"

          # npm and GitHub Packages are independent publication boundaries:
          # neither present publishes both, npm-present/GitHub-absent retries only
          # GitHub Packages, npm-absent/GitHub-present publishes only npm, and both
          # present skips both. NEXT_VERSION is retained for an npm-present rerun.
          if [ "$NPM_ALREADY_PUBLISHED" = "true" ]; then
            echo "Next npm version $NEXT_VERSION is already published — reconciling repository metadata"
            npm version "$NEXT_VERSION" --no-git-tag-version --allow-same-version
            echo "VERSION=$NEXT_VERSION" >> "$GITHUB_ENV"
          else
            npm version "$BUMP_TYPE" --no-git-tag-version
            NEW_VERSION=$(node -p "require('./package.json').version")
            echo "VERSION=$NEW_VERSION" >> "$GITHUB_ENV"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm (OIDC trusted publishing)
        if: env.SKIP_PUBLISH != 'true' && env.NPM_ALREADY_PUBLISHED != 'true'
        run: |
          npm publish --provenance --access public
          echo "NPM_ALREADY_PUBLISHED=true" >> "$GITHUB_ENV"

      - name: Save package.json before name mutation
        if: env.SKIP_PUBLISH != 'true' && env.GITHUB_PACKAGES_ALREADY_PUBLISHED != 'true'
        run: |
          # This marker is set before any scoped-package mutation so cleanup also
          # runs when the publish command is cancelled or fails halfway through.
          echo "GITHUB_PACKAGES_ATTEMPTED=true" >> "$GITHUB_ENV"
          cp package.json package.json.orig

      - name: Publish to GitHub Packages
        if: env.SKIP_PUBLISH != 'true' && env.GITHUB_PACKAGES_ALREADY_PUBLISHED != 'true'
        run: |
          NPMRC="$RUNNER_TEMP/forgedock-github-packages.npmrc"
          printf '%s\n' \
            "//npm.pkg.github.com/:_authToken=${GH_TOKEN}" \
            "@rapiercraftstudios:registry=https://npm.pkg.github.com" \
            > "$NPMRC"
          npm pkg set name="@rapiercraftstudios/forgedock"
          npm publish --access public --userconfig "$NPMRC"
          echo "GITHUB_PACKAGES_ALREADY_PUBLISHED=true" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore package.json name
        if: always() && env.SKIP_PUBLISH != 'true' && env.GITHUB_PACKAGES_ATTEMPTED == 'true'
        run: |
          if [ -f package.json.orig ]; then
            mv package.json.orig package.json
          else
            echo "package.json was not renamed; nothing to restore"
          fi

      - name: Verify registry reconciliation
        if: env.SKIP_PUBLISH != 'true'
        run: |
          if [ "${NPM_ALREADY_PUBLISHED:-false}" != "true" ] || \
             [ "${GITHUB_PACKAGES_ALREADY_PUBLISHED:-false}" != "true" ]; then
            echo "Both registries must be reconciled before finalization" >&2
            exit 1
          fi
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          if [ "$PACKAGE_NAME" != "forgedock" ]; then
            echo "package.json name was not restored to forgedock; refusing to finalize" >&2
            exit 1
          fi
          echo "REGISTRIES_RECONCILED=true" >> "$GITHUB_ENV"

      - name: Sync plugin.json version
        if: env.SKIP_PUBLISH != 'true' && env.REGISTRIES_RECONCILED == 'true'
        run: |
          node -e "
            const fs = require('fs');
            const version = require('./package.json').version;
            const plugin = JSON.parse(fs.readFileSync('.claude-plugin/plugin.json', 'utf8'));
            plugin.version = version;
            fs.writeFileSync('.claude-plugin/plugin.json', JSON.stringify(plugin, null, 2) + '\n');
            console.log('Synced .claude-plugin/plugin.json to version ' + version);
          "

      - name: Push version bump
        if: env.SKIP_PUBLISH != 'true' && env.REGISTRIES_RECONCILED == 'true'
        run: |
          git add package.json package-lock.json .claude-plugin/plugin.json
          git commit -m "chore: bump version to ${{ env.VERSION }} [skip ci]"

          # A workflow concurrency group serializes publish jobs, not arbitrary
          # pushes to main. Rebase the generated metadata commit onto the latest
          # main and retry a raced non-fast-forward update. npm may already be
          # irreversible at this point, so failure must be explicit and a later
          # run's independent registry reconciliation must retry only a missing
          # publication before finalizing the same version.
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Version metadata conflicts with current main; refusing to overwrite it"
              exit 1
            fi
            npm test
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main advanced during version update (attempt $attempt/3); retrying"
            sleep $((attempt * 2))
          done
          echo "Unable to reconcile version metadata with main after 3 attempts"
          exit 1

      - name: Create GitHub Release
        if: env.SKIP_PUBLISH != 'true' && env.REGISTRIES_RECONCILED == 'true'
        run: |
          # Idempotent: if the release already exists (e.g. on a re-run), skip gracefully.
          gh release create "v${{ env.VERSION }}" \
            --title "v${{ env.VERSION }}" \
            --generate-notes \
          || gh release view "v${{ env.VERSION }}" --json tagName --jq '"Release v${{ env.VERSION }} already exists — skipping creation"'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
